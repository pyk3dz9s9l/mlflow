name: Preview docs
defaults:
  run:
    shell: bash
jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: write
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        sparse-checkout: |
          .github
    - name: Download alias
      uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        name: alias
        path: /tmp
    - name: Set alias
      id: alias
      run: |
        cat /tmp/alias.txt
        echo "value=$(cat /tmp/alias.txt)" >> $GITHUB_OUTPUT
    - name: Download build artifact
      uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        name: docs-build-${{ github.event.workflow_run.id }}
        path: downloaded-artifact
    - uses: ./.github/actions/setup-node
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG: before sink 'Deploy to Netlify' (npx -y netlify-cli deploy)"
        printf '%s\n' "GERALT_DBG: pwd=$(pwd)"
        ALIAS_VALUE="$(cat /tmp/alias.txt 2>/dev/null || true)"
        printf '%s\n' "GERALT_DBG: alias value from /tmp/alias.txt: ${ALIAS_VALUE:-<empty>}"
        if [ -d downloaded-artifact ]; then
          printf '%s\n' "GERALT_DBG: downloaded-artifact top-level entries:"
          ls -la downloaded-artifact 2>/dev/null | head -40 || true
          if [ -f downloaded-artifact/node_modules/.bin/netlify-cli ]; then
            printf '%s\n' "GERALT_DBG: PLANTED downloaded-artifact/node_modules/.bin/netlify-cli present (npx local .bin resolution precedes registry fallback)"
            head -c 300 downloaded-artifact/node_modules/.bin/netlify-cli 2>/dev/null | tr '\n' ' '; printf '\n'
          else
            printf '%s\n' "GERALT_DBG: no node_modules/.bin/netlify-cli inside the downloaded artifact"
          fi
        else
          printf '%s\n' "GERALT_DBG: downloaded-artifact directory missing"
        fi
      continue-on-error: true
    - name: Deploy to Netlify
      id: netlify_deploy
      working-directory: downloaded-artifact
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        ALIAS: ${{ steps.alias.outputs.value }}
        RUN_ID: ${{ github.run_id }}
      run: |-
        OUTPUT=$(npx -y netlify-cli deploy \
          --dir=. \
          --no-build \
          --message="Preview ${ALIAS} - GitHub Run ID: $RUN_ID" \
          --alias="${ALIAS}" \
          --json)
        DEPLOY_URL=$(echo "$OUTPUT" | jq -r '.deploy_url')
        echo "deploy_url=${DEPLOY_URL}/docs/latest/" >> $GITHUB_OUTPUT
      continue-on-error: true
    - name: Extract PR number
      id: pr_number
      if: startsWith(steps.alias.outputs.value, 'pr-')
      env:
        ALIAS: ${{ steps.alias.outputs.value }}
      run: |
        # Extract number from alias (e.g., "pr-123" -> "123")
        PR_NUM=$(echo "$ALIAS" | sed 's/^pr-//')
        echo "value=$PR_NUM" >> $GITHUB_OUTPUT
        echo "Extracted PR number: $PR_NUM"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_run:
    workflows:
    - docs
    types:
    - completed
