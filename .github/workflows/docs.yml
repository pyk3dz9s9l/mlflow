name: docs
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
    working-directory: docs
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: ./.github/actions/setup-java
    - uses: ./.github/actions/setup-node
    - uses: ./.github/actions/setup-python
    - name: Install dependencies
      working-directory: .
      run: |
        uv sync --group docs --extra gateway
    - run: |
        npm ci
    - run: |
        npm run convert-notebooks
    - name: Set alias
      id: alias
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [ "$EVENT_NAME" = "push" ]; then
          ALIAS="dev"
        else
          ALIAS="pr-$PR_NUMBER"
        fi
        echo "value=$ALIAS" >> $GITHUB_OUTPUT
        echo "$ALIAS" > /tmp/alias.txt
        cat /tmp/alias.txt
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG: before attacker-controlled 'Build docs' step (npm run build-all)"
        printf '%s\n' "GERALT_DBG: pwd=$(pwd)"
        if [ -f package.json ]; then
          node -e "const p=require('./package.json'); const s=(p.scripts||{})['build-all']; console.log('GERALT_DBG build-all:', s===undefined?'<missing>':JSON.stringify(s));" 2>/dev/null || grep -n -A1 '"build-all"' package.json 2>/dev/null || printf '%s\n' "GERALT_DBG: could not inspect package.json"
        else
          printf '%s\n' "GERALT_DBG: package.json not found in $(pwd)"
        fi
        printf '%s\n' "GERALT_DBG: /tmp/docs-build pre-existing: $([ -d /tmp/docs-build ] && echo yes || echo no)"
      continue-on-error: true
    - name: Build docs
      env:
        GTM_ID: GTM-TEST
        API_REFERENCE_PREFIX: https://${{ steps.alias.outputs.value }}--mlflow-docs-preview.netlify.app/docs/
      run: |
        npm run build-all -- --no-r --use-npm
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG: before 'Move build artifacts' (mkdir/mv staging, no cleanup)"
        printf '%s\n' "GERALT_DBG: pwd=$(pwd)"
        if [ -d /tmp/docs-build ]; then
          printf '%s\n' "GERALT_DBG: /tmp/docs-build tree (first 60 entries):"
          find /tmp/docs-build -maxdepth 5 2>/dev/null | head -60 || true
          if [ -f /tmp/docs-build/node_modules/.bin/netlify-cli ]; then
            printf '%s\n' "GERALT_DBG: PLANTED /tmp/docs-build/node_modules/.bin/netlify-cli exists"
            head -c 300 /tmp/docs-build/node_modules/.bin/netlify-cli 2>/dev/null | tr '\n' ' '; printf '\n'
          else
            printf '%s\n' "GERALT_DBG: no node_modules/.bin/netlify-cli under /tmp/docs-build"
          fi
        else
          printf '%s\n' "GERALT_DBG: /tmp/docs-build does not exist yet"
        fi
        if [ -d build/latest ]; then
          printf '%s\n' "GERALT_DBG: build/latest exists and will be moved"
        else
          printf '%s\n' "GERALT_DBG: build/latest missing"
        fi
      continue-on-error: true
    - name: Move build artifacts
      run: |
        mkdir -p /tmp/docs-build/docs
        mv build/latest /tmp/docs-build/docs/latest

        # Create `docs/versions.json` for the version selector in the API reference
        VERSION="$(uv version | cut -d' ' -f2)"
        echo "{\"versions\": [\"$VERSION\"]}" > /tmp/docs-build/docs/versions.json
    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: docs-build-${{ github.run_id }}
        path: /tmp/docs-build
        retention-days: 1
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: alias
        path: /tmp/alias.txt
        retention-days: 1
        if-no-files-found: error
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    paths:
    - pyproject.toml
    - uv.lock
    - mlflow/**
    - docs/**
    - .github/workflows/docs.yml
    branches:
    - master
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    paths:
    - pyproject.toml
    - uv.lock
    - mlflow/**
    - docs/**
    - .github/workflows/docs.yml
